[project]
name = "kinetix-backend"
version = "0.1.0"
description = "Production AI Physique Analysis & Adaptive Workout Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pydantic-ai>=0.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "boto3>=1.35.0",
    "pillow>=11.0.0",
    "mediapipe>=0.10.18",
    "numpy>=2.1.0",
    "opencv-python-headless>=4.10.0.84",
    "pyjwt[crypto]>=2.10.0",
    "redis>=5.2.0",
    "logfire[fastapi,sqlalchemy,httpx]>=2.5.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
